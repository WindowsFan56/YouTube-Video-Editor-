<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Video Editor — 2015 Recreation</title>
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<header class="topbar">
  <div class="brand-area"><button class="hamburger">☰</button><div class="brand"><b>▶</b> YouTube</div></div>
  <div class="global-search"><input><button>⌕</button></div>
  <button class="upload-btn">Upload</button>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="creator">CREATOR STUDIO</div>
    <button>▦ <span>DASHBOARD</span></button>
    <button>▣ <span>VIDEO MANAGER</span><i>⌄</i></button>
    <button>◉ <span>LIVE STREAMING</span><i>⌄</i></button>
    <button>♟ <span>COMMUNITY</span><i>⌄</i></button>
    <button>● <span>CHANNEL</span></button>
    <button>▥ <span>ANALYTICS</span><i>⌄</i></button>
    <div class="create">CREATE</div>
    <button class="sub">Audio Library</button>
    <button class="sub active">Video Editor</button>
    <button class="feedback">Send feedback</button>
  </aside>

  <main class="main">
    <div class="projectbar">
      <button id="backBtn" class="small">←</button>
      <button class="project-menu">Project <span>⌄</span></button>
      <input id="projectName" value="My Edited Video">
      <span id="saveState">All changes saved.</span>
      <div class="project-actions">
        <button id="newBtn">New</button><button id="saveBtn">Save</button><button id="loadBtn">Load</button>
        <button id="createBtn" class="create-video">Create video</button>
      </div>
    </div>

    <section class="editor">
      <div class="preview-card">
        <div class="preview">
          <video id="previewVideo" playsinline></video><video id="transitionVideo" class="transition-video" playsinline muted></video><div id="transitionFallback" class="transition-fallback"></div>
          <div id="titleOverlay" class="title-overlay"></div>
          <div class="preview-empty">Add a video clip to preview it</div>
          <div class="player">
            <button id="playBtn">▶</button><button id="muteBtn">🔊</button>
            <span id="clock">0:00 / 0:00</span>
            <input id="scrubber" type="range" min="0" max="1000" value="0">
          </div>
        </div>
      </div>

      <div class="tool-tabs">
        <button class="tool active" data-panel="media">▣</button>
        <button class="tool" data-panel="transitions">◉</button>
        <button class="tool" data-panel="photos">▣</button>
        <button class="tool" data-panel="audio">♪</button>
        <button class="tool" data-panel="effects">◀▶</button>
        <button class="tool" data-panel="text">a</button>
        <button class="tool" data-panel="help">?</button>
      </div>

      <div class="asset-panel">
        <div class="asset-search"><input id="assetSearch" placeholder="Search Creative Commons videos"><span>⌕</span></div>
        <div id="panelContent"></div>
      </div>

      <div class="timeline-wrap">
        <div class="timeline-toolbar">
          <div class="track-icon">▰</div><div class="track-icon">♪</div>
        </div>
        <div class="timeline" id="timeline">
          <div class="ruler" id="ruler"></div>
          <div class="clip-track" id="clipTrack"></div>
          <div class="audio-track" id="audioTrack">Drag audio here</div>
          <div class="text-track" id="textTrack"></div>
          <div class="playhead" id="playhead"><span>0:00</span><b></b></div>
          <div class="zoom-controls"><button id="zoomOut">−</button><input id="zoom" type="range" min="50" max="180" value="100"><button id="zoomIn">+</button></div>
        </div>
      </div>

      <div class="edit-toolbar">
        <button id="trimLeft">Trim left</button><button id="trimRight">Trim right</button>
        <button id="splitBtn">Split</button><button id="deleteBtn">Delete</button>
        <span class="divider"></span>
        <button id="addTextBtn">Add text</button><button id="transitionBtn">Transition</button><button id="transitionManagerBtn">Transition manager</button>
      </div>
    </section>
  </main>
</div>

<input id="mediaInput" type="file" accept="video/*,image/*" multiple hidden>
<input id="audioInput" type="file" accept="audio/*" multiple hidden>
<input id="projectInput" type="file" accept=".json,application/json" hidden>

<div class="modal" id="transitionModal">
  <div class="dialog">
    <div class="dialog-title">Transition manager <button id="closeTransition">×</button></div>
    <div class="transition-help">Select a transition for the cut after the selected clip. Set its duration, preview it, or remove it. Durations are limited by the neighboring clips.</div>
    <div class="transition-settings">
      <label>Duration <input id="transitionDuration" type="number" min="0.1" max="10" step="0.1" value="1.0"> <span>seconds</span></label>
      <button id="previewTransition">Preview</button>
      <button id="clearTransition">Remove transition</button>
    </div>
    <input id="transitionSearch" placeholder="Search transitions">
    <div id="transitionGrid" class="transition-grid"></div>
  </div>
</div>

<div class="modal" id="textModal">
  <div class="dialog small-dialog">
    <div class="dialog-title">Add text <button id="closeText">×</button></div>
    <label>Text<input id="textValue" value="My title"></label>
    <label>Size<input id="textSize" type="number" value="32" min="10" max="120"></label>
    <button id="insertText" class="create-video">Add to video</button>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/media.js"></script>
<script src="js/timeline.js"></script>
<script src="js/transitions.js"></script>
<script src="js/project.js"></script>
<script src="js/app.js"></script>
</body>
</html>
