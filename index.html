<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Video Editor — 2015 Recreation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="top-left">
      <button class="hamburger" aria-label="Menu">☰</button>
      <div class="youtube-wordmark"><span class="yt-icon">▶</span><span>YouTube</span></div>
    </div>
    <div class="search-wrap">
      <input id="globalSearch" type="text" placeholder="">
      <button class="search-btn">⌕</button>
    </div>
    <button class="upload">Upload</button>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="creator-title">CREATOR STUDIO</div>
      <nav>
        <button>▦ <span>DASHBOARD</span></button>
        <button>▣ <span>VIDEO MANAGER</span><b>⌄</b></button>
        <button>◉ <span>LIVE STREAMING</span><b>⌄</b></button>
        <button>♟ <span>COMMUNITY</span><b>⌄</b></button>
        <button>● <span>CHANNEL</span></button>
        <button>▥ <span>ANALYTICS</span><b>⌄</b></button>
        <div class="create-label">CREATE</div>
        <button class="sub">Audio Library</button>
        <button class="sub active">Video Editor</button>
      </nav>
      <button class="feedback">Send feedback</button>
    </aside>

    <main class="workspace">
      <div class="projectbar">
        <button class="back">←</button>
        <button class="project-select">Project <span>⌄</span></button>
        <input id="projectName" value="My Edited Video">
        <span class="saved">All changes saved.</span>
        <button class="create-video">Create video</button>
      </div>

      <section class="editor">
        <div class="preview">
          <div class="preview-screen">
            <div class="fake-browser">
              <div class="mini-browserbar"></div>
              <div class="fake-page">
                <div class="fake-card"></div>
                <div class="fake-pink"></div>
                <div class="fake-lines"></div>
              </div>
            </div>
            <div class="playerbar">
              <span>▶</span><span>🔊</span><span id="timeLabel">0:03 / 12:45</span>
              <div class="player-progress"><i id="previewProgress"></i></div>
            </div>
          </div>
        </div>

        <div class="tool-tabs">
          <button class="tool active" data-panel="media">▣</button>
          <button class="tool" data-panel="transitions">◉</button>
          <button class="tool" data-panel="photos">▣</button>
          <button class="tool" data-panel="audio">♪</button>
          <button class="tool">◀▶</button>
          <button class="tool">a</button>
          <button class="tool">?</button>
        </div>

        <div class="asset-panel" id="assetPanel">
          <div class="asset-search"><input id="assetSearch" placeholder="Search Creative Commons videos"><span>⌕</span></div>
          <div id="panelContent"></div>
        </div>

        <div class="timeline-wrap">
          <div class="timeline-tools">
            <div class="track-head video-head">▰</div>
            <div class="track-head audio-head">♪</div>
          </div>
          <div class="timeline" id="timeline">
            <div class="ruler">
              <span style="left:0%">0:03</span><span style="left:25%">1:22</span><span style="left:36%">1:57</span>
              <span style="left:56%">4:31</span><span style="left:69%">6:01</span><span style="left:89%">12:06</span><span style="left:100%">12:45</span>
            </div>
            <div class="video-track" id="videoTrack">
              <div class="clip clip-a" data-duration="79"><span>1:22</span></div>
              <div class="clip clip-b" data-duration="35"><span>0:35</span></div>
              <div class="clip clip-c" data-duration="154"><span>2:33</span></div>
              <div class="clip clip-d" data-duration="90"><span>1:29</span></div>
              <div class="clip clip-e" data-duration="365"><span>6:04</span></div>
              <div class="clip clip-f" data-duration="39"><span>0:39</span></div>
              <div class="empty-slot"></div>
            </div>
            <div class="audio-track">Drag audio here</div>
            <div class="playhead" id="playhead"><div class="handle"></div><div class="line"></div><span>0:03</span></div>
            <div class="zoom">⌕ ─────</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="transition-modal" id="transitionModal">
    <div class="transition-dialog">
      <div class="dialog-head">Choose a transition <button id="closeModal">×</button></div>
      <div class="transition-grid" id="transitionGrid"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
